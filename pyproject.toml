[project]
license = { text = "Apache-2.0" }
name = "revagent"
version = "0.1.0"
description = "A layered, production agent built to The Agent Stack invariants"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pandas>=2.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "ollama>=0.6.2",
    "slack-sdk>=3.44.1",
    "temporalio>=1.33.0",
    "slack-bolt>=1.30.0",
]

[project.optional-dependencies]
# TabPFN pulls torch. Kept out of the default install so CI can check the approval
# boundary without building a deep-learning stack to do it.
prediction = [
    "tabpfn>=9.0.0",
]

[project.scripts]
agentstack = "agentstack.interfaces.cli:main"
agentstack-migrate = "agentstack.interfaces.migrate_cli:main"
agentstack-preflight = "agentstack.interfaces.preflight_cli:main"
agentstack-operator = "agentstack.interfaces.operator_cli:main"
agentstack-worker = "agentstack.interfaces.worker_cli:main"
agentstack-slack = "agentstack.interfaces.slack_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pandas-stubs>=2.2",
    # Dev tooling only: scripts/fetch_datasets.py. Never imported by the package -
    # it reaches the network, and only agentstack.execution may do that.
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentstack"]

[tool.pytest.ini_options]
# tests/live needs the Kaggle datasets on disk and is excluded here, visibly, in
# one place. See the "live cohort checks" row in CONSTRAINTS.md for where it runs.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --ignore=tests/live"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM"]

[[tool.mypy.overrides]]
# tabpfn ships no type stubs. Declared here, scoped to that one module, rather than as
# an inline suppression at the import site: the floor bans those, and a config entry
# naming exactly which third-party library is untyped is the honest form.
module = ["tabpfn.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
packages = ["agentstack"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
