[project]
name = "revenuecat-agent"
version = "0.1.0"
description = "A layered, production agent built to The Agent Stack (Parts 1-8) invariants"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentstack = "agentstack.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["agentstack"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
