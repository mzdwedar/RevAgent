# Dev substrate (layer 10). Production is not this file - see docs/adr/0005.
#
# Port 5433, not 5432: a laptop usually already has a Postgres on the default port,
# and silently connecting to the wrong database is a bad way to learn that.

# One project name wherever this file is run from. A second checkout of the repo is a
# separate directory, and compose would otherwise start a second project whose fixed
# container names collide with the first.
name: revenuecat-agent

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentstack-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent      # dev only; real credentials are an iteration-2 debt
      POSTGRES_DB: agentstack
    ports:
      - "5433:5432"
    volumes:
      - agentstack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentstack"]
      interval: 2s
      timeout: 3s
      retries: 15
    command:
      # The concurrency target in T21 is 100 runs. The default 100 connections leaves
      # nothing for psql or the migrator; the pool caps itself well below this.
      - "postgres"
      - "-c"
      - "max_connections=200"

  # The orchestrator (layer 10, serving 3). The CLI image's dev server is server 1.32.0,
  # the version the spike verified; auto-setup stopped at 1.29 (SPEC-durable-runtime).
  # SQLite on a volume: nothing of Temporal's lives in our Postgres. Production is
  # not this service - see docs/adr/0009.
  temporal:
    image: temporalio/temporal:1.9.1
    container_name: agentstack-temporal
    command:
      - "server"
      - "start-dev"
      - "--ip"
      - "0.0.0.0"
      - "--db-filename"
      - "/home/temporal/temporal.db"
    ports:
      - "7233:7233"   # frontend (gRPC)
      - "8233:8233"   # web UI
    volumes:
      - agentstack-temporaldata:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agentstack-pgdata:
  agentstack-temporaldata:
