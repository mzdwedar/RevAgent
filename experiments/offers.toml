# Bounds on what the model may choose (ADR-0015). Policy, layer 8: these numbers are read from
# this file and from nowhere else. No retrieved text, memory item, hypothesis or prompt moves
# one, and the model is told them so it can propose inside them - telling is not granting.
# Changing a number is a policy-threshold change, which SPEC.md lists as ask-first.
#
# Money is integer cents of the cohort's own currency; fractions are basis points
# (100 bps = 1%), so no bound is a float.

# The production default, as signed off 2026-10-05.
[profiles.default]
# The rollout percentage the model may choose. Inclusive.
percentage_min = 5
percentage_max = 15

# The smallest treatment arm worth measuring (see targeting.toml). On a 1,000-customer
# cohort this forces a percentage of at least 10, whatever the range above says.
minimum_treatment_arm = 100

# Total offer cost over the treatment arm, as a fraction of the cohort's annual value at
# risk: 500 bps = 5%.
cost_cap_bps = 500

# Each kind states what the model may choose and how its cost is computed from observed
# ARPU (never from a modelled value). `amount` and `months` are inclusive ranges.
#
# cost_basis:
#   percent_of_arpu_per_month   amount is a percent off; cost = ARPU/month x amount% x months
#   months_of_arpu              amount is whole months free; months is fixed at 1
#   uplift_of_arpu_per_month    amount is fixed at 1; cost = ARPU/month x uplift_bps x months
[profiles.default.kinds.percent_off]
amount_min = 10
amount_max = 50
months_min = 1
months_max = 3
cost_basis = "percent_of_arpu_per_month"

[profiles.default.kinds.free_months]
amount_min = 1
amount_max = 2
months_min = 1
months_max = 1
cost_basis = "months_of_arpu"

# The incremental cost of the higher tier is not observed anywhere in the data, so it is a
# stated business number rather than a derived one: 50% of ARPU per month. PLACEHOLDER - it
# was not part of the signed-off catalog; replace it with the real price difference.
[profiles.default.kinds.tier_upgrade]
amount_min = 1
amount_max = 1
months_min = 1
months_max = 3
cost_basis = "uplift_of_arpu_per_month"
uplift_bps = 5000

# The dev base is a 3,333-row dataset whose top decile is ~334 customers, so a 100-customer
# arm would force more than 15% and no percentage in range could ever qualify. This profile
# lowers only the arm floor, to 30, so the end-to-end path can run. It cannot measure an
# effect: like targeting's `dev`, it shows the machinery works, not that the offer does.
[profiles.dev]
percentage_min = 5
percentage_max = 15
minimum_treatment_arm = 30
cost_cap_bps = 500

[profiles.dev.kinds.percent_off]
amount_min = 10
amount_max = 50
months_min = 1
months_max = 3
cost_basis = "percent_of_arpu_per_month"

[profiles.dev.kinds.free_months]
amount_min = 1
amount_max = 2
months_min = 1
months_max = 1
cost_basis = "months_of_arpu"

[profiles.dev.kinds.tier_upgrade]
amount_min = 1
amount_max = 1
months_min = 1
months_max = 3
cost_basis = "uplift_of_arpu_per_month"
uplift_bps = 5000
