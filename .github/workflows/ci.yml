name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bar:
    runs-on: ubuntu-latest

    services:
      # tests/infra does not skip when Postgres is absent - it fails and says so.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agentstack
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agentstack"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://agent:agent@localhost:5433/agentstack

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # stack_guard and changed-line coverage need the base

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # tests/infra does not skip when Temporal is absent either. Not a service
      # container: those cannot pass the image a command, and this one needs
      # `server start-dev`. Compose keeps it the same definition as dev.
      - name: Temporal
        run: docker compose up -d --wait temporal

      - name: Lint, format, types, layer contracts
        run: bash scripts/check_fast.sh

      - name: Tests and architecture fitness
        run: uv run pytest --cov=agentstack --cov-report=lcov -q

      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        run: uv run python scripts/changed_line_coverage.py --base origin/${{ github.base_ref }} --min 80

      - name: Release gates (Part 8)
        run: uv run python -m evals run --gates

      - name: Did the bar get weakened?
        if: github.event_name == 'pull_request'
        run: uv run python scripts/stack_guard.py --base origin/${{ github.base_ref }}

      # Criterion 22. On a PR the last release is the base branch; on a push to main it
      # is the commit main was at before the push.
      - name: Would this deploy strand live runs?
        run: >-
          uv run python scripts/checkpoint_guard.py --base
          ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependencies
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            ./
